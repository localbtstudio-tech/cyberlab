<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYBERLAB — Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    
<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="logo">
            <span class="logo-icon">C</span>
            <span class="logo-text">CYBER<span>LAB</span></span>
        </a>

        <nav class="nav-links" aria-label="Main navigation">

            <a href="index.html" class="nav-link">
                HOME
            </a>

            <a href="missions.html" class="nav-link">
                MISSIONS
            </a>

            <a href="index.html#about"
               id="aboutLink"
               class="nav-link">
                ABOUT
            </a>

            <a href="login.html"
               id="loginLink"
               class="nav-link">
                LOGIN
            </a>

            <a href="register.html"
               id="registerLink"
               class="nav-cta">
                REGISTER NOW
            </a>

            <span id="userInfo"
                  class="user-info"
                  hidden></span>

            <a href="#"
               id="logoutLink"
               class="nav-cta nav-logout"
               hidden>
                LOGOUT
            </a>

        </nav>
    </div>
</header>



    <main>

        <section class="auth-page">

            <div class="auth-header">

                <p class="section-label">
                    CYBERLAB ACCOUNT
                </p>

                <h1>
                    LOGIN
                </h1>

                <p>
                    Sign in to access your CyberLab account.
                </p>

            </div>


            <form id="login-form" class="auth-form">

                <label for="email">
                    EMAIL
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >


                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="submit"
                    class="button"
                    id="login-button"
                >
                    LOGIN
                </button>


                <p id="result"></p>

            </form>

        </section>

    </main>


    <script src="js/login.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
